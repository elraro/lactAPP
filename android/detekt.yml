# Deviations from detekt's defaults, each with its reason.
naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
complexity:
  CyclomaticComplexMethod:
    # A `when` that maps names to values one-to-one is a table, not branching logic.
    ignoreSimpleWhenEntries: true
  LongParameterList:
    # Stateless composables take their state and callbacks as parameters;
    # constructors list injected dependencies.
    ignoreAnnotated: ['Composable']
    constructorThreshold: 10
    functionThreshold: 7
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # A screen is one file of small composables; a repository or view model exposes one
    # small function per user action. Splitting them by count alone would scatter a feature.
    ignoreAnnotated: ['Dao']
    thresholdInClasses: 25
    thresholdInFiles: 25
style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    # Early returns for validation and null checks are the house style.
    active: false
  LoopWithTooManyJumpStatements:
    # Same reason, for `continue`; the statistics loops also mirror the Go engine line by line.
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
